<!DOCTYPE html>
<html>
 <head>
 <title>Anne Veski esinemiste kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   var hypik;
   function algus(){
    kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);
      new L.TileLayer('https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
	  attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
	  tms: true,
    }).addTo(kaart);
	  fetch("https://script.google.com/macros/s/AKfycbxLC5Xs8m2fFP8cQ1PmWbQHNTOLj3YdKu-hEdt4qyNlgflAWknQCsSgI6TULgt6MMTRbw/exec"
		    ).then(d => d.json()).then(kuva);
	   console.log("tellitud");   	
	   hypik = L.popup(); 
	   kaart.on("click", vajutus);
  }
  function vajutus(e){
	hypik.setLatLng(e.latlng).
	setContent("Vajutasid "+e.latlng.toString()).openOn(kaart);
  }
  function kuva(kohad){
	console.log(kohad);
	  let kogupikkus = 0;
	  for(let koht of kohad){
	    L.marker([koht[0], koht[1]]).addTo(kaart);
  }
	    L.polyline(kohad, {color: "blue"}).addTo(kaart);
	  for(let i=0; i<kohad.length-1; i++){
		  let punkt1 = L.latLng(kohad[i][0], kohad[i][1]);
		  let punkt2 = L.latLng(kohad[i+1][0], kohad[i+1][1]);
          let kaugus = punkt1.distanceTo(punkt2) / 1000;
          kogupikkus += kaugus;
          console.log(kaugus);
  }
      let tekst = "";
      for(let i=0; i<kohad.length-1; i++){
          let punkt1 = L.latLng(kohad[i][0], kohad[i][1]);
          let punkt2 = L.latLng(kohad[i+1][0], kohad[i+1][1]);
          let kaugus = punkt1.distanceTo(punkt2)/1000;
          tekst += kaugus.toFixed(1)+" km<br>";
  }
    tekst += "kokku: "+kogupikkus.toFixed(1)+" km";
    document.getElementById("kaugused").innerHTML = tekst;
  }
  </script>
 </head>  
 <body onload="algus()">
  <div id="kaardikiht"></div>
  <div id="kaugused"></div>
 </body>
</html>
