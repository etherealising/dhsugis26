<!doctype html>
<html>
  <head>
     <script>
        function kysi(kategooria) {
    let lause = `SELECT ?artistLabel WHERE {
            ?artist wdt:P136 wd:Q213424.

            SERVICE wikibase:label {
                bd:serviceParam wikibase:language "en".
            }
        }
        LIMIT 10
    `;

    vastus.innerHTML = "Ootan vastust...";

    fetch("https://query.wikidata.org/sparql?query="
        + encodeURIComponent(lause) + "&format=json")
        .then(d => d.json())
        .then(kuva)
        .catch(error => {
            console.log(error);
            vastus.innerHTML = "Viga!";
        });
}
      LIMIT 15
`;
          console.log(lause)
          let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(lause);  
          vastus.innerHTML="Ootan vastust...";
          fetch(aadress).then(d => d.json()).then(kuva);
}
       
function kuva(d){
  console.log(d);
  vastus.innerHTML="";
  for(let rida of d["results"]["bindings"]){
    console.log(rida["artistLabel"]["value"]);
    let lause=document.createElement("li");
    lause.textContent=rida["artistLabel"]["value"];
    vastus.appendChild(lause);
           }
        }
   </script>
  </head>
    <body>
      <h1>K-Pop artistid</h1>
      <button onclick="kysi('male')">
          Meesartistid
      </button>

      <button onclick="kysi('female')">
          Naisartistid
      </button>

      <button onclick="kysi('solo')">
          Sooloartistid
      </button>

      <ul id="vastus"></ul>
    </body>
</html>
