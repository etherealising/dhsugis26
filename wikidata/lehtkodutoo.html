<!doctype html>
<html>
  <head>
     <script>
        function kysi(kategooria = "male"){
           let lause=`SELECT DISTINCT ?artist ?artistLabel WHERE {
         ${
            kategooria === "solo"
            ? `
               ?artist wdt:P31 wd:Q5.
               ?artist wdt:P136 ?genre.
               ?genre rdfs:label ?genreLabel.
               FILTER(CONTAINS(LCASE(?genreLabel), "k-pop")
                   || CONTAINS(LCASE(?genreLabel), "kpop"))
             `
            : `
               ?artist wdt:P31/wdt:P279* wd:Q215380.
               ?artist wdt:P136 ?genre.
               ?genre rdfs:label ?genreLabel.
               FILTER(CONTAINS(LCASE(?genreLabel), "k-pop")
                   || CONTAINS(LCASE(?genreLabel), "kpop"))

               ?artist wdt:P527 ?member.
               ?member wdt:P21 ?gender.

               FILTER(
                  ${kategooria === "male"
                    ? '?gender = wd:Q6581097'
                    : '?gender = wd:Q6581072'}
               )
             `
         }

         SERVICE wikibase:label {
            bd:serviceParam wikibase:language "en,ko,et".
         }
      }
      ORDER BY ?artistLabel
      LIMIT 15
`;
          console.log(lause)
          let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);  
          vastus.innerHTML="ootan vastust";
          fetch(aadress).then(d => d.json()).then(kuva);
}
       
function kuva(d){
  console.log(d);
  vastus.innerHTML="";
  for(let rida of d["results"]["bindings"]){
    console.log(rida["artistLabel"]["value"]);
    let lause=document.createElement("li");
    lause.textContent=rida["artistLabel"]["value"];
    vastus.appendChild(lause);
           }
        }
   </script>
  </head>
    <body>
      <h1>K-Pop artists</h1>
      <button onclick="kysi('male')">
          Male groups
      </button>

      <button onclick="kysi('female')">
          Female groups
      </button>

      <button onclick="kysi('solo')">
          Solo artists
      </button>

      <ul id="vastus"></ul>
    </body>
</html>
